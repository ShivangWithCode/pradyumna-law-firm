<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 135" fill="none" class="kh-emblem-svg">
  <g class="kh-emblem-paths" fill="currentColor">
    <!-- ==================== TOP JUDICIAL CREST ARCH ==================== -->
    <!-- Central Leaf Finial (Jewel of Justice) -->
    <path d="M 100 6 C 94 15, 92 21, 100 29 C 108 21, 106 15, 100 6 Z" />
    <circle cx="100" cy="17.5" r="1.6" fill="none" stroke="currentColor" stroke-width="0.8" />

    <!-- Upper Winged Pediment Arch (Scales Balance Beam) -->
    <path d="M 100 23.5 C 78 17.5, 50 22.5, 23 35 C 18 37.5, 15 41, 18 44 C 21 46, 25 43.5, 29 40 C 51 30, 78 25.5, 100 29.5 C 122 25.5, 149 30, 171 40 C 175 43.5, 179 46, 182 44 C 185 41, 182 37.5, 177 35 C 150 22.5, 122 17.5, 100 23.5 Z" />
    <circle cx="19" cy="42" r="2.2" />
    <circle cx="181" cy="42" r="2.2" />

    <!-- Lower Cradling Ribbon Arch -->
    <path d="M 100 32.5 C 82 28.5, 62 32.5, 41 40.5 C 39 41.5, 37 40.5, 37 39 C 37 37.5, 39 36.5, 42 35.5 C 62 27.5, 82 24.5, 100 27.5 C 118 24.5, 138 27.5, 158 35.5 C 161 36.5, 163 37.5, 163 39 C 163 40.5, 161 41.5, 159 40.5 C 138 32.5, 118 28.5, 100 32.5 Z" opacity="0.85" />

    <!-- ==================== LETTER 'P' (LEFT) ==================== -->
    <!-- P Vertical Stem & Serifs -->
    <path d="M 23 45 H 41 V 49 H 36 V 105 H 41 V 109 H 23 V 105 H 28 V 49 H 23 Z" />
    <!-- P Bowl (Graceful Roman Arch) -->
    <path d="M 36 46 H 57 C 71 46, 79 53, 79 63.5 C 79 74, 70 80.5, 56 80.5 H 36 Z M 36 52 V 74.5 H 55 C 64 74.5, 70 70, 70 63.5 C 70 56.5, 64 52, 55 52 Z" fill-rule="evenodd" />

    <!-- ==================== LETTER 'L' (CENTER - PROMINENT, BOLD & DISTINCT) ==================== -->
    <!-- Unified Capital 'L' with classical serifs and clear horizontal foot -->
    <path d="M 81 45 H 99 V 49 H 94.5 V 101 H 122 V 93.5 H 127 V 109 H 81 V 105 H 85.5 V 49 H 81 Z" />

    <!-- ==================== LETTER 'A' (RIGHT) ==================== -->
    <!-- Apex and Diagonals -->
    <path d="M 152 45 H 162 L 188 109 H 176 L 169.5 91 H 144.5 L 138 109 H 126 L 152 45 Z M 147 85 H 167 L 157 58 Z" fill-rule="evenodd" />
    <!-- A Apex Cap Serif -->
    <path d="M 149 45 H 165 V 48.5 H 149 Z" />
    <!-- Left Base Serif -->
    <path d="M 124 109 H 140 V 105.5 H 124 Z" />
    <!-- Right Base Serif -->
    <path d="M 174 109 H 190 V 105.5 H 174 Z" />

    <!-- ==================== PEDESTAL / BASELINE ACCENT ==================== -->
    <!-- Primary Baseline -->
    <rect x="18" y="115" width="164" height="2.5" rx="1.25" />
    <!-- Classical Stepped Plinth -->
    <rect x="40" y="120" width="120" height="1.8" rx="0.9" opacity="0.75" />
  </g>
</svg>
